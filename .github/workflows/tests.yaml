name: Tests

on:
  push:
  pull_request:
  schedule:
    # Weekly, so a new Home Assistant release or an RBFA API change is noticed.
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  pytest:
    name: Home Assistant ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Minimum version supported (hacs.json "homeassistant").
          - name: "2024.12.0 (minimum)"
            python: "3.12"
            # Keep two libraries at the versions 2024.12 shipped with: josepy 2
            # dropped an API its cloud integration uses, and pycares 4.9+ leaves
            # a resolver thread behind that the test harness reports as a leak.
            install: pytest-homeassistant-custom-component==0.13.190 "josepy<2" "pycares<4.9"
          # Newest Home Assistant the test package supports; it follows each
          # Home Assistant release within days.
          - name: latest
            python: "3.14"
            install: pytest-homeassistant-custom-component
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          pip install ${{ matrix.install }}
          python -c "from homeassistant.const import __version__; print('Home Assistant', __version__)"
      - name: Run tests
        run: pytest -v --cov=custom_components.rbfa --cov-report=term-missing --cov-report=json
      - name: Check coverage per module (Silver rule test-coverage)
        run: python scripts/check_coverage.py

  rbfa-api:
    name: Live RBFA API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install aiohttp
      - run: python scripts/check_rbfa_api.py
