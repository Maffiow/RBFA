# Status of the rules of the Home Assistant integration quality scale:
# https://contributors.home-assistant.io/core/quality-scale/
#
# RBFA is a custom integration, so Home Assistant lists it as "custom" and
# does not grade it. This file tracks the rules anyway: it is the checklist
# for keeping the integration at Silver level, and the starting point if it
# is ever contributed to core.
rules:
  # Bronze
  action-setup:
    status: exempt
    comment: The integration registers no actions.
  appropriate-polling: done
  brands:
    status: todo
    comment: >-
      Needs a pull request to home-assistant/brands with an icon and logo
      under custom_integrations/rbfa.
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency:
    status: exempt
    comment: >-
      The integration has no requirements; it talks to the RBFA API with the
      aiohttp session of Home Assistant. Core would ask to move API.py into a
      library on PyPI.
  docs-actions:
    status: exempt
    comment: The integration registers no actions.
  docs-conditions:
    status: exempt
    comment: The integration provides no conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: The integration provides no triggers.
  entity-event-setup:
    status: exempt
    comment: Entities get their data from the coordinator and subscribe to no events.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: exempt
    comment: The integration registers no actions.
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: The RBFA API is public and needs no account.
  test-coverage: done

  # Gold
  devices: todo
  diagnostics: todo
  discovery:
    status: exempt
    comment: A web service cannot be discovered on the network.
  discovery-update-info:
    status: exempt
    comment: A web service cannot be discovered on the network.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: todo
  docs-supported-devices:
    status: exempt
    comment: The integration connects to a web service, not to devices.
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: todo
  dynamic-devices:
    status: exempt
    comment: One config entry follows one team; there are no devices to add later.
  entity-category: todo
  entity-device-class: todo
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: todo
  icon-translations: todo
  reconfiguration-flow: todo
  repair-issues: todo
  stale-devices:
    status: exempt
    comment: One config entry follows one team; there are no devices that go stale.

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing: todo
